# dbuild configuration — immich-cli
# Full reference: https://github.com/daemonless/dbuild

build:
  variants:
    - tag: latest
      containerfile: Containerfile

# immich-cli is a ONE-SHOT command, not a long-running service: the entrypoint
# (`immich`, default CMD `--version`) runs once and exits 0, so shell/port/
# health/screenshot modes have no live process to probe. `command` mode runs
# the image to completion and asserts the exit code (+ an output regex) instead.
cit:
  mode: command
  expect_output: '2\.7\.5'   # `immich --version`
